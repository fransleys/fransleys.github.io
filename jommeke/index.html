<title>Jommeke-kiezer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root{--sky:#ffe27a;--sky2:#fff3b8;--red:#e63b2e;--red-d:#b52519;--green:#5cb85c;--green-d:#3f8f3f;--ink:#2b2118;}
  *{box-sizing:border-box}
  html{overflow-x:hidden;overflow-x:clip;width:100%;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;overscroll-behavior-x:none}
  html,body{margin:0;min-height:100%;max-width:100%}
  body{touch-action:pan-y;overscroll-behavior-x:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;padding-top:env(safe-area-inset-top);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
  .stage,.joke{-webkit-user-select:text;user-select:text}
  button,.btn{touch-action:manipulation}
  body{font-family:'Nunito',system-ui,sans-serif;position:relative;color:var(--ink);background:linear-gradient(var(--sky2),var(--sky) 60%);min-height:100vh;display:flex;flex-direction:column;align-items:center;overflow-x:hidden;position:relative}
  .sun{position:absolute;top:calc(-70px + env(safe-area-inset-top));right:-70px;pointer-events:none;width:220px;height:220px;opacity:.9;animation:spin 60s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  header{text-align:center;padding:28px 16px 6px;position:relative;z-index:2}
  h1{font-family:'Bangers',cursive;font-size:clamp(40px,11vw,72px);letter-spacing:2px;margin:0;color:var(--red);text-shadow:3px 3px 0 #fff,5px 5px 0 var(--ink);transform:rotate(-2deg)}
  .sub{margin:10px 0 0;font-weight:800}
  main{width:100%;max-width:560px;padding:12px 16px calc(190px + env(safe-area-inset-bottom));position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:18px}
  .stage{width:100%;min-height:450px;background:#fff;border:4px solid var(--ink);border-radius:22px;box-shadow:6px 6px 0 var(--ink);padding:20px 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative;
    background-image:radial-gradient(#ffe9a0 1.4px,transparent 1.6px);background-size:12px 12px}
  .stage:after{content:"";position:absolute;bottom:-26px;left:46px;border:14px solid transparent;border-top:20px solid var(--ink);border-bottom:0}
  .hint{font-family:'Bangers';font-size:30px;letter-spacing:1px}
  .num{font-family:'Bangers';font-size:34px;color:#fff;background:var(--red);border:3px solid var(--ink);border-radius:50%;min-width:84px;height:84px;padding:0 10px;display:flex;align-items:center;justify-content:center;transform:rotate(-6deg);box-shadow:3px 3px 0 var(--ink);margin-bottom:10px}
  .title{font-family:'Bangers';font-size:clamp(30px,8.5vw,46px);line-height:1.05;letter-spacing:1px;margin:0}
  .spinning .title{opacity:.55;filter:blur(.6px)}
  .pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
  @keyframes pop{from{transform:scale(.6) rotate(-4deg);opacity:0}to{transform:none;opacity:1}}
  .tag{font-weight:800;font-size:14px;margin-top:8px;background:var(--sky);border:2px solid var(--ink);border-radius:999px;padding:2px 12px}
  .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:14px}
  button,.btn{font-family:'Nunito';font-weight:800;font-size:16px;border:3px solid var(--ink);border-radius:14px;padding:10px 16px;background:#fff;color:var(--ink);cursor:pointer;box-shadow:3px 3px 0 var(--ink);text-decoration:none;display:inline-block}
  button:active,.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
  button:focus-visible,.btn:focus-visible{outline:3px solid #1b6bff;outline-offset:2px}
  .big{font-family:'Bangers';font-size:clamp(30px,9vw,42px);letter-spacing:2px;color:#fff;background:var(--red);padding:16px 38px;border-radius:999px;box-shadow:0 7px 0 var(--red-d),0 7px 0 3px var(--ink);border:3px solid var(--ink);margin-top:10px;transition:transform .08s}
  .big:active{transform:translateY(5px);box-shadow:0 2px 0 var(--red-d),0 2px 0 3px var(--ink)}
  .big[disabled]{opacity:.5;cursor:default}
  .opts{display:flex;flex-direction:column;gap:8px;align-items:center;font-weight:800}
  .opts label{display:flex;gap:8px;align-items:center;cursor:pointer}
  .opts input{width:20px;height:20px;accent-color:var(--red)}
  .count{font-weight:800;background:#fff;border:3px solid var(--ink);border-radius:12px;padding:6px 14px}
  .small{font-size:14px;background:transparent;box-shadow:none;border:2px solid var(--ink);padding:6px 12px}
  body{background-image:radial-gradient(rgba(230,59,46,.10) 1.6px,transparent 1.8px),linear-gradient(var(--sky2),var(--sky) 60%);background-size:14px 14px,100% 100%}
  .stage:after{display:none}

  ["Jommeke drinkt op straat uit een plas.","Marie: Niet doen! Daar zitten allemaal bacteriën in!","Jommeke: Die zijn dood. Ik ben er net met mijn step doorheen gereden."],
  ["Jommeke ziet een briefje van 50 euro op de grond liggen.","Jommeke: Oma, mag ik dat?","Oma: Nee, alles op de grond is vies.","Dan valt oma. Oma: Jommeke, help me!","Jommeke: Nee oma, alles op de grond is vies."],
  ["Jommeke komt bij de Chinees. In het aquarium zit een haai die alle visjes opeet.","De eigenaar: Ik regel dat wel.","Hij zegt tegen de haai: Foe jong haai!"],
  ["Jommeke spuugt op het raam van de burgemeester.","Burgemeester: Wat zou je moeder zeggen als ik op jouw raam spuugde?","Jommeke: Dat zou ze knap vinden. Wij wonen op de zevende verdieping."],
  ["Juf: Noem eens een paar dieren.","Jommeke: Een geitje, een konijntje.","Juf: Zeg niet telkens tje erbij!","Jommeke: Een lieveheersbeestje?"],
  ["Mama: Jommeke, het is veel te laat. Naar bed!","Jommeke: Maar mama, het is al veel te laat om nog naar bed te gaan."],
  ["Jommeke gaat helemaal vooraan bij de kassa staan.","Kassière: Ga achteraan in de rij staan!","Jommeke: Dat kan niet. Daar staat al iemand."],
  ["Oma: Zie je het bos al, Jommeke?","Jommeke: Nee, want al die bomen staan in de weg."],
  ["Jommeke zit met papa in het stadion, tussen 40.000 voetbalfans. Hij heeft er genoeg van.","Papa: Je hebt gelijk. Maar je weet wat we je geleerd hebben: eerst iedereen netjes een handje geven."],
  ["Papa: Jommeke, heb je je sit-ups gedaan?","Jommeke: Ja, papa. Alleen ben ik de ups vergeten."],
  ["Mama: Jommeke, maak je bed eens op.","Jommeke komt terug met mama's make-updoos en legt alles op zijn bed.","Mama: Wat doe je met mijn make-up op je bed?","Jommeke: U zei dat ik mijn bed moest opmaken!"]
];
let lastJoke = -1;
function nextJoke(){
  let i; do { i = Math.floor(Math.random()*JOKES.length); } while(i === lastJoke && JOKES.length > 1);
  lastJoke = i;
  const box = document.getElementById("jokeText");
  box.innerHTML = "";
  JOKES[i].forEach(line => {
    const p = document.createElement("p");
    const m = line.match(/^([^:]{1,22}):\s*(.*)$/);
    if(m){ const st = document.createElement("strong"); st.textContent = m[1] + ": "; p.append(st, document.createTextNode(m[2])); }
    else p.textContent = line;
    box.append(p);
  });
  document.getElementById("joke").hidden = false;
}

const $ = id => document.getElementById(id);
const stage = $("stage"), go = $("go");
let read = new Set();
try { read = new Set(JSON.parse(localStorage.getItem("jommeke-read")||"[]")); } catch(e){}
function save(){ try{ localStorage.setItem("jommeke-read",JSON.stringify([...read])); }catch(e){} }

const pool = () => ALBUMS;
const left = () => pool().filter(a=>!read.has(a.id));

function updateCount(){
  const p = pool(), l = left();
  $("count").textContent = l.length + " van " + p.length + " nog te kiezen";
  go.disabled = l.length === 0;
}

let current = null, timer = null;
function show(a, spinning){
  stage.classList.toggle("spinning", !!spinning);
  stage.innerHTML = "";
  const wrap = document.createElement("div");
  if(!spinning) wrap.className = "pop";
  const book = document.createElement("div"); book.className = "book";
  const spine = document.createElement("div"); spine.className = "spine";
  const cover = document.createElement("div"); cover.className = "cover";
  const brand = document.createElement("div"); brand.className = "brand"; brand.textContent = "JOMMEKE";
  const num = document.createElement("div"); num.className = "num"; num.textContent = a.n;
  const h = document.createElement("h2"); h.className = "title" + (a.t.length>30?" xl":a.t.length>20?" l":""); h.textContent = a.t;
  cover.append(brand,num,h); book.append(spine,cover); wrap.append(book);
  if(!spinning){ const b = document.createElement("div"); b.className = "boem"; b.textContent = ["BOEM!","POEF!","TADAA!","WOW!"][Math.floor(Math.random()*4)]; wrap.style.position="relative"; wrap.append(b); }
  if(!spinning){
    const row = document.createElement("div"); row.className = "row";
    const ok = document.createElement("button"); ok.textContent = "Dit lezen we! ✓";
    ok.onclick = () => { read.add(a.id); save(); stage.innerHTML = '<div class="hint pop">Veel leesplezier!</div>'; current=null; updateCount(); };
    const again = document.createElement("button"); again.textContent = "Andere graag";
    again.onclick = () => pick();
    row.append(ok,again);
    wrap.append(row);
  }
  stage.append(wrap);
}

function pick(){
  const l = left().filter(a => !current || a.id !== current.id);
  const choices = l.length ? l : left();
  if(!choices.length){ stage.innerHTML = '<div class="hint">Alles gelezen! Wis de lijst om opnieuw te beginnen.</div>'; updateCount(); return; }
  const target = choices[Math.floor(Math.random()*choices.length)];
  const all = pool();
  go.disabled = true;
  let i = 0, steps = 18, delay = 60;
  clearTimeout(timer);
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(reduce){ current = target; show(target,false); nextJoke(); go.disabled=false; return; }
  (function tick(){
    if(i++ < steps){
      show(all[Math.floor(Math.random()*all.length)], true);
      delay += 14;
      timer = setTimeout(tick, delay);
    } else {
      current = target; show(target,false); nextJoke(); go.disabled = false;
    }
  })();
}

go.onclick = pick;
document.getElementById("jokeNext").onclick = nextJoke;
$("reset").onclick = () => { read.clear(); save(); updateCount(); stage.innerHTML = '<div class="hint">Lijst gewist. Druk op de rode knop!</div>'; };
updateCount();
</script>
